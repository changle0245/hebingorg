const POST_FILES = ['pdf-merge-complete-guide.html','excel-batch-processing.html','local-vs-cloud-tools.html','word-pdf-conversion-deep-dive.html','image-compression-best-practices.html','developer-toolbox-essentials.html','file-privacy-protection.html','qrcode-generation-guide.html'];

function setLang(lang){
  const d = I18N[lang]; if(!d) return;
  document.documentElement.lang = ({zh:'zh-CN',en:'en',ar:'ar'})[lang];
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.getElementById('navBack').textContent = d.navBack;
  document.getElementById('pageH1').textContent = d.title;
  document.getElementById('pageIntro').textContent = d.intro;
  document.getElementById('introBoxText').textContent = d.introBox;

  const list = document.getElementById('postList');
  list.innerHTML = d.posts.map((p,i) => `
    <a href="${POST_FILES[i]}" class="post-item">
      <div class="post-meta"><span class="post-cat">${p[0]}</span><span>${p[1]}</span><span>${p[2]}</span></div>
      <h2 class="post-title">${p[3]}</h2>
      <p class="post-excerpt">${p[4]}</p>
    </a>
  `).join('');

  const f = d.footer;
  document.getElementById('footerLinks').innerHTML = `
    <a href="/">${f.home}</a><a href="/about.html">${f.about}</a><a href="/blog/">${f.blog}</a><a href="/contact.html">${f.contact}</a><a href="/terms.html">${f.terms}</a><a href="/privacy.html">${f.privacy}</a>
  `;
  localStorage.setItem('hebing_lang', lang);
}

const sl = localStorage.getItem('hebing_lang') || (navigator.language.startsWith('ar') ? 'ar' : navigator.language.startsWith('zh') ? 'zh' : 'en');
setLang(sl);
</script>
